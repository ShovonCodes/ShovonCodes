name: Generate Language Metrics

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC = 12:00 AM Dhaka (GMT+6)
  workflow_dispatch:        # manual trigger from Actions tab
  push:
    branches:
      - main
      - master

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate languages card (includes private repos)
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6  # v3.34
        with:
          # PAT with `repo` + `read:user` scope, owned by you, so private
          # repository language bytes are counted.
          token: ${{ secrets.SNAKE_GITHUB_TOKEN }}
          user: ShovonCodes
          filename: metrics.languages.svg
          config_timezone: Asia/Dhaka

          # Commit the SVG straight to a dedicated branch so master
          # stays clean (mirrors the snake's `output` branch).
          output_action: commit
          committer_branch: metrics-output
          committer_message: "chore: update language metrics"

          # Only the languages card, nothing else
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss
          plugin_languages_colors: github

          # Count private repos you own / collaborate on
          repositories_affiliations: owner, collaborator
